name: quizzeo
description: Quizzéo — quiz de culture générale.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.4
  flutter_riverpod: ^2.6.1
  material_ui: ^1.11.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/questions.json
    # Sons générés (CC0, voir assets/sounds/LICENSES.md).
    - assets/sounds/correct.wav
    - assets/sounds/wrong.wav
    - assets/sounds/streak.wav
    - assets/sounds/fanfare.wav
  # Polices embarquées (licence OFL, voir assets/fonts/OFL-*.txt).
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-700.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-800.ttf
          weight: 800
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-400.ttf
          weight: 400
        - asset: assets/fonts/AtkinsonHyperlegible-700.ttf
          weight: 700
