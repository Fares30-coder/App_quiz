<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quizzéo · Pistes d'icône</title>
<!-- Comparaison des 3 pistes à 180, 60 et 29 px (taille réglages iOS), masque arrondi iOS simulé (rayon ≈ 22,37 %). -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#FFF7EE;color:#1A1B3A;font:400 16px/1.45 'Atkinson Hyperlegible',system-ui,sans-serif;padding:32px}
h1{font:800 28px/1.2 'Bricolage Grotesque',system-ui,sans-serif;margin-bottom:24px}
.ligne{display:flex;align-items:center;gap:28px;padding:20px 0;border-top:2px solid #E6DED2}
.ligne h2{width:260px;font:700 17px/1.3 'Atkinson Hyperlegible',sans-serif}
.ligne h2 span{display:block;font-weight:400;font-size:14px;color:#4A4C6B}
img{display:block;border-radius:22.37%}
.fonce{background:#12132A;padding:10px;border-radius:12px;display:flex;gap:16px;align-items:center}
</style>
</head>
<body>
<h1>Pistes d'icône</h1>
<div class="ligne"><h2>A · é blanc sur corail<span>Piste de la charte</span></h2><img src="icone-a-corail.svg" width="180" height="180" alt="Piste A"><img src="icone-a-corail.svg" width="60" height="60" alt=""><img src="icone-a-corail.svg" width="29" height="29" alt=""><div class="fonce"><img src="icone-a-corail.svg" width="60" height="60" alt=""><img src="icone-a-corail.svg" width="29" height="29" alt=""></div></div>
<div class="ligne"><h2>B · é dans un anneau de timer<span>Encre, safran, crème</span></h2><img src="icone-b-timer.svg" width="180" height="180" alt="Piste B"><img src="icone-b-timer.svg" width="60" height="60" alt=""><img src="icone-b-timer.svg" width="29" height="29" alt=""><div class="fonce"><img src="icone-b-timer.svg" width="60" height="60" alt=""><img src="icone-b-timer.svg" width="29" height="29" alt=""></div></div>
<div class="ligne"><h2>C · é corail sur crème<span>Le « é » du logotype</span></h2><img src="icone-c-creme.svg" width="180" height="180" alt="Piste C" style="box-shadow:0 0 0 1px #E6DED2"><img src="icone-c-creme.svg" width="60" height="60" alt=""><img src="icone-c-creme.svg" width="29" height="29" alt=""><div class="fonce"><img src="icone-c-creme.svg" width="60" height="60" alt=""><img src="icone-c-creme.svg" width="29" height="29" alt=""></div></div>
</body>
</html>
